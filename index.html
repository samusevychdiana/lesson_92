<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <section class="happyhours">
        <img src="img/photo.webp" alt="photo">
        <div class="happyhours-content">
            <h2>Happy Hours</h2>
            <p>Monday - Friday (4:00 Pm - 7:00 pm)</p>
        </div>
    </section>

    <section class="contact">
        <div class="contact-content">
            <h3>Contact</h3>
            <img src="img/spoon.webp" alt="spoon">
            <h2>Find Us</h2>
            <p>Lane Ends Bungalow, Whatcroft Hall Lane, Rudheath, CW9 7SG</p>
            <div class="contact-info">
                <h2>Opening Hours</h2>
                <p>Mon - Fri: 10:00 am - 02:00 am</p>
                <p>Sat - Sun: 10:00 am - 03:00 am</p>
            </div>

            <div class="button-visit">Visit Us</div>
        </div>

        <div class="contact-img">
            <img src="img/cocktail.webp" alt="cocktail">
        </div>
    </section>
</body>

</html>
